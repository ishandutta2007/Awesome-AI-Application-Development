<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .orb1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 80px;
    }
    .orb2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 280px;
    }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: dashStream 3s linear infinite;
    }
    .card-float-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }
    .rotating-wheel {
      animation: rotateRing 20s linear infinite;
      transform-origin: 1100px 90px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)"/>

  <!-- Dynamic / Animated Ambient Elements in Background -->
  <g class="orb1">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.3"/>
  </g>
  <g class="orb2">
    <circle cx="1020" cy="280" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.25"/>
  </g>

  <!-- Animated Data / Agent Stream Flow Lines (Background) -->
  <path class="stream-line" d="M -50 180 Q 300 20 600 180 T 1250 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35"/>
  <path class="stream-line" d="M -50 220 Q 300 360 600 200 T 1250 200" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.35" style="animation-duration: 4s;"/>

  <!-- Rotating tech wheel on right background -->
  <g class="rotating-wheel" opacity="0.25">
    <circle cx="1100" cy="90" r="50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 14"/>
    <circle cx="1100" cy="90" r="30" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 8"/>
  </g>

  <!-- Background dynamic floating badges/pills on sides (not obstructing text) -->
  <g class="card-float-1" transform="translate(60, 45)">
    <rect width="160" height="38" rx="19" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#10b981"/>
    <text x="36" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ LLM Orchestration</text>
  </g>

  <g class="card-float-2" transform="translate(50, 275)">
    <rect width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#6366f1"/>
    <text x="36" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 Autonomous Agents</text>
  </g>

  <g class="card-float-1" transform="translate(980, 275)">
    <rect width="160" height="38" rx="19" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#f59e0b"/>
    <text x="36" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔍 Enterprise RAG</text>
  </g>

  <!-- Foreground Content: Header, Title, Subtitle, and Feature Pills -->
  <!-- Top Category Chip -->
  <g transform="translate(485, 38)">
    <rect width="230" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
    <text x="28" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED AI ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" fill="url(#textGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Awesome AI Application Development
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
    The Definitive Guide to LLM App Builders, Visual Workflows &amp; Multi-Agent Frameworks
  </text>

  <!-- Key Capability Tags in Foreground -->
  <g transform="translate(245, 225)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛠️ Low-Code / No-Code</text>

    <!-- Tag 2 -->
    <rect x="180" y="0" width="165" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="262" y="20" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 Visual AI Workflows</text>

    <!-- Tag 3 -->
    <rect x="365" y="0" width="165" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="447" y="20" text-anchor="middle" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧩 Agentic Frameworks</text>

    <!-- Tag 4 -->
    <rect x="550" y="0" width="160" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="630" y="20" text-anchor="middle" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔓 100% Open Source</text>
  </g>

  <!-- Clean Border Outline for the whole banner -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>
